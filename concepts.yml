context: energy
name: Energy and Utilities
intro: >-
  The common utility-data vocabulary -- the meters on a premises, the readings and interval usage
  they record, the utility accounts and bills they roll up into and the tariffs that price them --
  distilled from the APIs that already exist, energy-sector open-data standards included.
tags: [Utilities, Electricity, Smart Metering, Utility Data, Energy Data, Energy Management, Green Button, Electric Utilities]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, Data, Links, Meta]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id, meter_id, account_id, service_point_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, meter_status, account_status]
  start_at: [start, start_date, interval_start, period_start, from, start_time, read_start]
  end_at: [end, end_date, interval_end, period_end, to, end_time, read_end]
  unit: [units, uom, unit_of_measure]

concepts:
  meter:
    segments: [meters, meter, service_points, servicepoints, service-points, usage_points, usagepoints, nmis, mpans, electricity_meters]
    aliases:
      number: [meter_number, serial_number, meter_serial, nmi, mpan, mprn]
      fuel: [commodity, service_type, energy_type, utility_type]
      address: [service_address, premise_address, location]
  meter_reading:
    requires: [meter]
    path: /meter-readings
    segments: [readings, reading, intervals, interval_data, usage, consumption, meter_readings, meterreadings, interval_reads, energy_usage]
    aliases:
      value: [reading, kwh, usage, consumption, quantity, amount, energy]
      reading_type: [type, read_type, quality, register]
  utility_account:
    requires: [meter]
    path: /utility-accounts
    segments: [accounts, account, service_agreements, contracts@energy|utility, premises]
    aliases:
      account_number: [number, account_no, customer_number]
      utility: [provider, supplier, utility_name, retailer]
      address: [service_address, billing_address, premise]
  # utility_bill was measured and dropped: 5 providers expose bills, 2 with a readable schema and nothing shared.

shared_specs:
  au-cdr-energy: [aemo, aer, agl-energy, alinta-energy, cdr-energy, energy-queensland, energyaustralia,
                  origin-energy, powershop, red-energy, simply-energy]
duplicates:
  eia: [doe]
  leap: [leapfrog-power]
  national-energy-system-operator: [neso]

findings:
  - >-
    Eleven Australian retailers and regulators publish the same Consumer Data Right energy standard;
    counted once, the open market is thin. Meters agree only on id -- status, meter_type and number
    each reach a third of providers.
  - >-
    Meter readings agree on start and end and unit: an interval with a unit is the shared shape,
    the value field is spelled differently by every provider.
decisions:
  - >-
    The CDR energy standard counts as one voice (au-cdr-energy), as the banking standard did; without
    that, its servicepoint vocabulary would be the core of the context.
  - >-
    Bills were dropped: two readable schemas share nothing. Utility accounts stay at extended, with
    the meter they belong to as the required parent.
